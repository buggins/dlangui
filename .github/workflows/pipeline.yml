# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        dc:
          - dmd-latest
          - ldc-latest
        include:
          # minimum supported frontend (README: DMD frontend 2.100.2 or newer)
          - os: ubuntu-latest
            dc: dmd-2.100.2
          - os: ubuntu-latest
            dc: ldc-1.30.0
          - os: windows-latest
            dc: dmd-2.100.2
          # LDC packaged by Ubuntu 24.04 (frontend 2.106)
          - os: ubuntu-latest
            dc: ldc-1.36.0
          # macOS (arm64; DMD doesn't support arm64)
          - os: macos-latest
            dc: ldc-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Checkout source
        uses: actions/checkout@v7

      - name: 'Unittest build of a dependent app'
        run: |
          # Links an application against dlangui.lib without WinMain (see #710)
          cd examples/helloworld
          dub test

      - name: 'Build & Test'
        run: |
          # Build and run tests, as defined by `unittest` configuration
          # In this mode, `mainSourceFile` is excluded and `version (unittest)` are included
          # See https://dub.pm/package-format-json.html#configurations
          dub test
          cd examples/example1
          dub build -b=release

      - name: 'Build console configuration'
        run: |
          cd examples/example1
          dub build -b=release -c console
