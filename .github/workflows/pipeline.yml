# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        dc:
          - dmd-latest
          - ldc-latest
        include:
          # minimum supported frontend (README: DMD frontend 2.100.2 or newer)
          - os: ubuntu-latest
            dc: dmd-2.100.2
          - os: ubuntu-latest
            dc: ldc-1.30.0
          - os: windows-latest
            dc: dmd-2.100.2
          # LDC packaged by Ubuntu 24.04 (frontend 2.106)
          - os: ubuntu-latest
            dc: ldc-1.36.0
          # macOS (arm64; DMD doesn't support arm64)
          - os: macos-latest
            dc: ldc-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Checkout source
        uses: actions/checkout@v7

      # Cache DUB packages so that jobs keep working when code.dlang.org downloads fail (#741):
      # dub warns and uses the cached packages. The key includes the compiler (each comes with its
      # own dub, and dub versions differ in package layout) and the month (dependency ranges pick
      # up new versions; an existing cache entry is never updated).
      - name: Get month for DUB cache key
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/AppData/Local/dub/packages
          key: dub-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}-${{ steps.month.outputs.month }}
          restore-keys: |
            dub-${{ runner.os }}-${{ matrix.dc }}-

      - name: 'Unittest build of a dependent app'
        run: |
          # Links an application against dlangui.lib without WinMain (see #710)
          cd examples/helloworld
          dub test

      - name: 'Build & Test'
        run: |
          # Build and run tests, as defined by `unittest` configuration
          # In this mode, `mainSourceFile` is excluded and `version (unittest)` are included
          # See https://dub.pm/package-format-json.html#configurations
          dub test

      - name: 'Build examples'
        shell: bash
        run: |
          # default configuration: Win32 backend on Windows, SDL elsewhere
          for example in example1 dmledit tetris; do
            dub build -b=release --root=examples/$example
          done

      - name: 'Build examples: console configuration'
        shell: bash
        run: |
          for example in example1 dmledit tetris; do
            dub build -b=release -c console --root=examples/$example
          done

      - name: 'Build examples: SDL configuration'
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for example in example1 dmledit tetris; do
            dub build -b=release -c sdl --root=examples/$example
          done
