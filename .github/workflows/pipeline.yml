# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        dc:
          - dmd-latest
          - ldc-latest
        include:
          # minimum supported frontend (README: DMD frontend 2.100.2 or newer)
          - os: ubuntu-latest
            dc: dmd-2.100.2
          # old LDC binaries need libxml2.so.2, which ubuntu-latest (26.04) doesn't have
          - os: ubuntu-24.04
            dc: ldc-1.30.0
          - os: windows-latest
            dc: dmd-2.100.2
          # LDC packaged by Ubuntu 24.04 (frontend 2.106)
          - os: ubuntu-24.04
            dc: ldc-1.36.0
          # macOS (arm64; DMD doesn't support arm64)
          - os: macos-latest
            dc: ldc-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Checkout source
        uses: actions/checkout@v7

      # Cache DUB packages so that jobs keep working when code.dlang.org downloads fail (#741):
      # dub warns and uses the cached packages. The key includes the compiler (each comes with its
      # own dub, and dub versions differ in package layout) and the month (dependency ranges pick
      # up new versions; an existing cache entry is never updated).
      - name: Get month for DUB cache key
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/AppData/Local/dub/packages
          key: dub-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}-${{ steps.month.outputs.month }}
          restore-keys: |
            dub-${{ runner.os }}-${{ matrix.dc }}-

      - name: 'Unittest build of a dependent app'
        run: |
          # Links an application against dlangui.lib without WinMain (see #710)
          cd examples/helloworld
          dub test

      - name: 'Build & Test'
        run: |
          # Build and run tests, as defined by `unittest` configuration
          # In this mode, `mainSourceFile` is excluded and `version (unittest)` are included
          # See https://dub.pm/package-format-json.html#configurations
          dub test

      - name: 'Build examples'
        shell: bash
        run: |
          # default configuration: Win32 backend on Windows, SDL elsewhere
          for example in example1 dmledit tetris; do
            dub build -b=release --root=examples/$example
          done

      - name: 'Build examples: console configuration'
        shell: bash
        run: |
          for example in example1 dmledit tetris; do
            dub build -b=release -c console --root=examples/$example
          done

      - name: 'Build examples: SDL configuration'
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for example in example1 dmledit tetris; do
            dub build -b=release -c sdl --root=examples/$example
          done

      - name: 'Install X11 development libraries'
        if: runner.os == 'Linux'
        run: |
          # the x11 configuration links -lX11 and -lGLX
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libx11-dev libglx-dev

      - name: 'Build examples: X11 configuration'
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for example in example1 dmledit tetris; do
            dub build -b=release -c x11 --root=examples/$example
          done

  # DIP1000 (scoped pointers, -preview=dip1000) for the dlangui sources, so that they stay compatible (#907).
  # The flag is added to the root dub.json for this job only: dub passes it to dlangui and to the packages
  # that depend on it (tests, examples), not to the dependencies (arsd, bindbc, ...).
  # -allinst: the flag changes the mangled names of some template instances, so dlangui can't link to the
  # instances compiled into the dependencies (e.g. inilike's IniLikeReader); emit all of them in dlangui.
  dip1000:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dc: dmd-latest
          - os: ubuntu-latest
            dc: ldc-latest
          # version (Windows) code
          - os: windows-latest
            dc: dmd-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Get month for DUB cache key
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/AppData/Local/dub/packages
          key: dub-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}-${{ steps.month.outputs.month }}
          restore-keys: |
            dub-${{ runner.os }}-${{ matrix.dc }}-

      - name: 'Add -preview=dip1000 to dub.json'
        shell: bash
        run: |
          sed -i '1a\    "dflags": ["-preview=dip1000", "-allinst"],' dub.json
          head -3 dub.json
          dub describe --data=dflags | grep -q -- -preview=dip1000

      - name: 'Unittests'
        run: dub test

      - name: 'Build library configurations and example1'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then configs="sdl console minimal"; else configs="x11 console minimal"; fi
          for config in $configs; do
            dub build -c $config
          done
          dub build --root=examples/example1

  # Static analysis with D-Scanner, checks configured in dscanner.ini (#906). Fails on any warning.
  dscanner:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          # builds D-Scanner 0.16.0-beta.5
          compiler: ldc-1.36.0

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: ~/.dub/packages
          key: dub-dscanner-0.16.0-beta.5-ldc-1.36.0

      - name: 'D-Scanner'
        run: dub run -q dscanner@0.16.0-beta.5 -- --styleCheck --config dscanner.ini src
